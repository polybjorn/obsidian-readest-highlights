# The forge is origin and GitHub is a fast-forward copy with the full history,
# because Obsidian's plugin directory reads manifest.json and the release
# assets from GitHub, and GitHub Actions build and attest those releases from
# the synced tag. Nothing is forced, so a commit made on GitHub stops the sync
# until it is pulled into the forge. The sync waits for the attribution and
# prose checks and both test jobs.
#
# ci-actions is cloned through $GITHUB_SERVER_URL and its scripts run directly,
# not through `uses:`. That form needs the CI host written out, this file goes
# to GitHub with the history, and the denylist gate refuses the host name.
name: CI

on:
  push:
    branches: [main]
    # Obsidian requires the release tag to equal the manifest version, so the
    # tags carry no v prefix.
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
    # The two label types rerun the changelog check when no-changelog changes
    types: [opened, synchronize, reopened, labeled, unlabeled]

defaults:
  run:
    shell: bash

jobs:
  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test the pattern
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/check-attribution.sh" selftest
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          # Commits sync to GitHub, where a forge issue ref names another issue
          # or none. `Closes #N` goes in the PR description instead.
          NO_FORGE_REFS: "true"
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/attribution" bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/run.sh"

  prose:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Fetch the prose engine
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/fetch-engine.sh"
      - name: Self-test the engine and the check
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/selftest.sh"
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/prose" bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/run.sh"

  test:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      # Offline against the runner's /osv cache, so the package list never
      # reaches osv.dev. It reads the lockfile, so it sits ahead of npm ci.
      # A finding to live with goes in osv-scanner.toml as [[IgnoredVulns]].
      - name: Self-test the OSV gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/osv-scan/selftest.sh"
      - name: Known vulnerabilities in dependencies
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/osv-scan/scan.sh"
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Ahead of github-sync, so a tag with no notes can still be deleted here
      # before GitHub sees it
      - name: Release notes for the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/changelog.ts notes "$GITHUB_REF_NAME" > /dev/null

  # The plugin in Obsidian itself, under a virtual display. The runner keeps
  # no cache between jobs, so each run downloads both Obsidian versions.
  e2e:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Virtual display and the libraries Obsidian links against
        run: apt-get update -qq && xargs -a tests/e2e/apt-packages.txt apt-get install -y -qq --no-install-recommends
      - run: npm ci
        timeout-minutes: 5
      - run: xvfb-run -a npm run test:e2e:display

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Check for a changelog entry
        run: node scripts/changelog.ts check-pr

  # The denylist gate github-sync runs after the merge, run on the PR instead,
  # while a hit is still fixed by a force-push to the branch rather than a
  # rewrite of main.
  commit-gate:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          # Full depth puts origin/main and the merge-base in the checkout
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Self-test commit-gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/selftest.sh"
      - name: Gate the PR's commits
        env:
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/commit-gate.sh"

  github-sync:
    if: github.event_name == 'push'
    needs: [attribution, prose, test, e2e]
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Push to GitHub
        env:
          DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          REPO: polybjorn/obsidian-readest-highlights
          REF: ${{ github.ref }}
          TAGS: '[0-9]*'
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/github-sync/github-sync.sh"
