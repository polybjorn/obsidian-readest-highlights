name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 26.x
                  cache: "npm"
            # A stable tag is what Obsidian's updater installs, so it has to be code
            # main carries and name the version manifest.json names. A beta reaches
            # only BRAT users and may test a branch before it merges.
            - name: Check the tag
              if: ${{ !contains(github.ref_name, '-') }}
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "::error::$TAG is not on main"
                      exit 1
                  fi
                  version=$(node -p 'require("./manifest.json").version')
                  if [ "$TAG" != "$version" ]; then
                      echo "::error::$TAG does not match manifest.json version $version"
                      exit 1
                  fi
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
            # A tag like 1.10.0-beta.1 is a pre-release for BRAT testers. main's
            # manifest.json stays at the last stable version, because Obsidian's
            # updater reads that file and fetches the release it names, so only
            # the uploaded copy carries the beta version.
            - name: Stamp the pre-release version
              if: contains(github.ref_name, '-')
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
                    m.version = process.env.TAG;
                    fs.writeFileSync("manifest.json", JSON.stringify(m, null, "\t"));
                  '
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: "main.js,styles.css,manifest.json"
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  # A stable release compares against the last stable tag, a
                  # pre-release against the tag before it, beta or not.
                  case "$TAG" in
                      *-*) prerelease=(--prerelease); tags=$(git tag) ;;
                      *) prerelease=(); tags=$(git tag | grep -v -- - || true) ;;
                  esac

                  notes=$(node scripts/changelog.ts notes "$TAG")
                  prev=$(printf '%s\n' "$tags" "$TAG" | sort -uV | grep -B1 -x -- "$TAG" | grep -vx -- "$TAG" | head -1 || true)
                  if [ -n "$prev" ]; then
                      notes="${notes}"$'\n\n'"**Full Changelog**: https://github.com/${REPO}/compare/${prev}...${TAG}"
                  fi
                  gh release create "$TAG" \
                      --title "$TAG" \
                      "${prerelease[@]}" \
                      --notes "$notes" \
                      main.js manifest.json styles.css
