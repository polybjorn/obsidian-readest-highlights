name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Overlay analysis saves a base database to the Actions cache on every
        # push to main, for pull requests to build on, and PRs are rare on this
        # copy, so none is ever read back.
        env:
            CODEQL_OVERLAY_DATABASE_MODE: none
        permissions:
            security-events: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript]
        steps:
            - uses: actions/checkout@v7
            - uses: github/codeql-action/init@v4.39.4
              with:
                  languages: ${{ matrix.language }}
            - uses: github/codeql-action/analyze@v4.39.4
              with:
                  category: /language:${{ matrix.language }}
